name: Bug report
description: Report a reproducible bug in OpenVoxTuner
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the bug?
      placeholder: Clear and concise description of the issue.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide exact steps.
      placeholder: |
        1. Open DAW...
        2. Load plugin...
        3. Set Harmony to...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - macOS
        - Other
    validations:
      required: true

  - type: dropdown
    id: format
    attributes:
      label: Plugin format
      options:
        - VST3
        - AU
        - Standalone
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: e.g. 0.1.1

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots / audio
      description: Paste relevant logs or attach captures.
