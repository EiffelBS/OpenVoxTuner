name: Release

# Builds OpenVoxTuner for Windows and macOS and publishes the artifacts as a
# GitHub Release.
#   - Windows ships an unsigned Inno Setup installer (SmartScreen warning).
#   - macOS ships a signed+notarized .pkg installer (Standalone in /Applications,
#     VST3 + AU + companion OpenVoxKey in /Library/Audio/Plug-Ins). The pkg passes
#     Gatekeeper on a stock macOS: every bundle is codesigned with "Developer ID
#     Application" (hardened runtime + ovt.entitlements), the pkg is signed with
#     "Developer ID Installer" and the whole product is notarized + stapled.
#   - macOS ALSO ships an unsigned drag-and-drop zip (ad-hoc signed bundles) for
#     users who prefer manual install. Because it is unsigned, those bundles carry
#     the com.apple.quarantine attribute after download and need
#     `sudo xattr -rd com.apple.quarantine <path>` before a DAW will load them.
#
# Triggers: push of a tag "v*" (e.g. v0.1.47) or manual dispatch.
#
# Required GitHub secrets (repo Settings -> Secrets and variables -> Actions):
#   MACOS_CERT_APP_P12_B64             base64 of the "Developer ID Application" .p12
#   MACOS_CERT_APP_P12_PASSWORD        password of the above .p12
#   MACOS_CERT_INSTALLER_P12_B64       base64 of the "Developer ID Installer" .p12
#   MACOS_CERT_INSTALLER_P12_PASSWORD  password of the above .p12
#   APPLE_API_KEY                      content of the App Store Connect API key (.p8, single line)
#   APPLE_API_KEY_ID                   API key id (e.g. XHT9SU62AJ)
#   APPLE_API_ISSUER                   API issuer UUID (App Store Connect -> Users and Access -> Keys)
#
# How to create the .p12 files (from Keychain Access, once both Developer ID
# certificates are installed and trusted):
#   security export -k ~/Library/Keychains/login.keychain-db -t certs -f pkcs12 \
#     -o cert_app.p12 -P "<password>" "Developer ID Application: <Name> (TEAMID)"
#   security export -k ~/Library/Keychains/login.keychain-db -t certs -f pkcs12 \
#     -o cert_installer.p12 -P "<password>" "Developer ID Installer: <Name> (TEAMID)"
#   base64 < cert_app.p12          # paste into MACOS_CERT_APP_P12_B64
#   base64 < cert_installer.p12    # paste into MACOS_CERT_INSTALLER_P12_B64
#
# The signing identities below must match the CN of the installed certificates.
#
# Prerequisites (must be committed to the repo):
#   - CMakeLists.txt must declare `project(... LANGUAGES C CXX)` so the ARA SDK
#     (C code) compiles on macOS.
#   - JUCE is pinned to 8.0.8 (the version this codebase compiles against);
#     do NOT use the JUCE default branch (it removed Font::getStringWidth).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.61)'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # The release version with the leading "v". Comes from the workflow_dispatch
  # input (used by version-bump.yml) or, for a manual tag push, from the pushed
  # tag (github.ref_name). A GITHUB_TOKEN-driven tag push does NOT re-trigger this
  # workflow (GitHub limitation), so version-bump.yml dispatches it explicitly
  # with the `version` input.
  OVT_RELEASE: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  windows-release:
    runs-on: windows-2022
    env:
      # Forward the tag (e.g. "v0.1.61") to the build script, which strips the "v".
      # Note: the `env` context is not available in a job-level `env:` block, so we
      # use the github expression directly (dispatch input wins, manual tag push
      # falls back to github.ref_name).
      OVT_VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout JUCE 8.0.8
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.8
          path: JUCE

      - name: Build Windows installer
        shell: pwsh
        run: |
          $env:JUCE_PATH = "${{ github.workspace }}\JUCE"
          .\scripts\build_installer.ps1

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenVoxTuner-Windows-Installer
          path: build/installer/OpenVoxTuner_Windows_Installer.exe

  macos-release:
    runs-on: macos-latest
    env:
      # Must match the CN of the certificates imported from the secrets above.
      MACOS_APP_IDENTITY: "Developer ID Application: JEROME BEROUD (XXBTBG8N7M)"
      MACOS_INSTALLER_IDENTITY: "Developer ID Installer: JEROME BEROUD (XXBTBG8N7M)"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout JUCE 8.0.8
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.8
          path: JUCE

      - name: Import signing certificates
        env:
          # Dedicated CI keychain (runner.temp is only valid inside a step env).
          KEYCHAIN: "${{ runner.temp }}/ovt-signing.keychain-db"
          KEYCHAIN_PASSWORD: "ovt-ci-keychain"
          MACOS_CERT_APP_P12_B64: ${{ secrets.MACOS_CERT_APP_P12_B64 }}
          MACOS_CERT_APP_P12_PASSWORD: ${{ secrets.MACOS_CERT_APP_P12_PASSWORD }}
          MACOS_CERT_INSTALLER_P12_B64: ${{ secrets.MACOS_CERT_INSTALLER_P12_B64 }}
          MACOS_CERT_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_CERT_INSTALLER_P12_PASSWORD }}
        run: |
          set -euo pipefail

          # Apple intermediates/root for the Developer ID G2 chain
          curl -fsSL -o /tmp/DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          curl -fsSL -o /tmp/AppleRootCA-G2.cer https://www.apple.com/certificateauthority/AppleRootCA-G2.cer

          # Dedicated CI keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Decode and import the .p12 certificates. "already exists" is
          # harmless (e.g. an intermediate bundled in the .p12); the explicit
          # checks below verify the two required identities are actually present.
          echo "$MACOS_CERT_APP_P12_B64" | base64 --decode > /tmp/cert_app.p12
          echo "$MACOS_CERT_INSTALLER_P12_B64" | base64 --decode > /tmp/cert_installer.p12
          security import /tmp/cert_app.p12 -P "$MACOS_CERT_APP_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN" || echo "warn: cert_app already imported"
          security import /tmp/cert_installer.p12 -P "$MACOS_CERT_INSTALLER_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN" || echo "warn: cert_installer already imported"
          security import /tmp/DeveloperIDG2CA.cer -A -k "$KEYCHAIN" || echo "warn: DeveloperIDG2CA already imported"
          security import /tmp/AppleRootCA-G2.cer -A -k "$KEYCHAIN" || echo "warn: AppleRootCA-G2 already imported"
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain /tmp/AppleRootCA-G2.cer

          # Make it the default keychain and let codesign/productbuild access the
          # private keys without a UI prompt
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Fail loudly if a required identity did not make it into the keychain
          security find-certificate -a -c "Developer ID Application" -k "$KEYCHAIN" >/dev/null || { echo "MISSING: Developer ID Application certificate"; exit 1; }
          security find-certificate -a -c "Developer ID Installer" -k "$KEYCHAIN" >/dev/null || { echo "MISSING: Developer ID Installer certificate"; exit 1; }

          echo "--- signing identities ---"
          security find-identity -v -p codesigning

      - name: Configure (macOS, VST3 + AU + Standalone + companion)
        run: |
          cmake -S . -B build-mac-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DJUCE_PATH="${{ github.workspace }}/JUCE" \
            -DOVT_VERSION="${OVT_RELEASE#v}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DOVT_ENABLE_AU=ON

      - name: Build VST3 + AU + Standalone + companion
        run: |
          cmake --build build-mac-release --config Release --target OpenVoxTuner_VST3
          cmake --build build-mac-release --config Release --target OpenVoxTuner_AU
          cmake --build build-mac-release --config Release --target OpenVoxTuner_Standalone
          cmake --build build-mac-release --config Release --target OpenVoxKey_VST3
          cmake --build build-mac-release --config Release --target OpenVoxKey_AU

      - name: Build signed + notarized .pkg
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          echo "$APPLE_API_KEY_CONTENT" > /tmp/AuthKey.p8
          chmod 600 /tmp/AuthKey.p8
          export APPLE_API_KEY=/tmp/AuthKey.p8
          scripts/build_macos_pkg.sh --skip-build --build-dir build-mac-release \
            --formats VST3,AU,STANDALONE --version "${OVT_RELEASE#v}" \
            --sign-identity "$MACOS_APP_IDENTITY" \
            --sign-installer "$MACOS_INSTALLER_IDENTITY" \
            --notarize --output OpenVoxTuner-macOS.pkg

      - name: Package macOS zip (unsigned)
        run: |
          cd "${{ github.workspace }}/build-mac-release/OpenVoxTuner_artefacts/Release"
          mkdir -p OpenVoxTuner-macOS
          cp -R VST3/OpenVoxTuner.vst3 OpenVoxTuner-macOS/
          cp -R AU/OpenVoxTuner.component OpenVoxTuner-macOS/
          cp -R Standalone/OpenVoxTuner.app OpenVoxTuner-macOS/
          ditto -c -k --keepParent OpenVoxTuner-macOS OpenVoxTuner-macOS.zip
          mv OpenVoxTuner-macOS.zip "${{ github.workspace }}/"

      - name: Upload macOS artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: OpenVoxTuner-macOS
          path: OpenVoxTuner-macOS.zip

      - name: Upload macOS installer artifact (pkg)
        uses: actions/upload-artifact@v4
        with:
          name: OpenVoxTuner-macOS-Pkg
          path: OpenVoxTuner-macOS.pkg

  publish-release:
    needs: [windows-release, macos-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (needed to build release notes from git history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          clean: false

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenVoxTuner-Windows-Installer
          path: release-assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenVoxTuner-macOS
          path: release-assets

      - name: Download macOS installer artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenVoxTuner-macOS-Pkg
          path: release-assets

      - name: Build release notes
        id: notes
        run: |
          set -euo pipefail
          CUR="${OVT_RELEASE}"
          NOTES="release_notes.md"
          {
            echo "## What's Changed — ${CUR}"
            echo ""
            PREV="$(git describe --tags --abbrev=0 "${CUR}^" 2>/dev/null || true)"
            if [ -z "${PREV}" ]; then
              echo "Initial release."
            else
              echo "### Changes (${PREV} → ${CUR})"
              echo ""
              CHANGES="$(git log --no-merges --pretty=format:"%s|%h" "${PREV}..${CUR}" \
                | while IFS='|' read -r subj hash; do
                    case "$subj" in
                      ci:*|build:*|release:*|chore:*|windows:*) continue ;;
                    esac
                    echo "  - ${subj} (${hash})"
                  done)"
              if [ -z "${CHANGES}" ]; then
                echo "  _No user-visible changes in this release (internal fixes / infrastructure)._"
              else
                echo "${CHANGES}"
              fi
              echo ""
              echo ""
              echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/${PREV}...${CUR}"
            fi
          } > "${NOTES}"
          echo "----- release notes -----"
          cat "${NOTES}"
        shell: bash

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # On workflow_dispatch (from version-bump) the run's ref is a branch,
          # so the action cannot infer the tag from the ref — pass it explicitly.
          # On a manual tag push, github.ref_name already matches OVT_RELEASE.
          tag_name: ${{ env.OVT_RELEASE }}
          body_path: release_notes.md
          files: |
            release-assets/OpenVoxTuner_Windows_Installer.exe
            release-assets/OpenVoxTuner-macOS.zip
            release-assets/OpenVoxTuner-macOS.pkg

      - name: Update latest.json (update-checker version info)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${OVT_RELEASE#v}"
          CONTENT=$(printf '{\n  "version": "%s",\n  "url": "https://github.com/EiffelBS/OpenVoxTuner/releases/latest"\n}\n' "$VER" | base64 -w0)
          SHA=$(gh api repos/EiffelBS/OpenVoxTuner/contents/docs/releases/latest.json --jq '.sha')
          gh api -X PUT repos/EiffelBS/OpenVoxTuner/contents/docs/releases/latest.json \
            -f message="release: update latest.json to ${GITHUB_REF_NAME}" \
            -f content="$CONTENT" \
            -f sha="$SHA"
        shell: bash
