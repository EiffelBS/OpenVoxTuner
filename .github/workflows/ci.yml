name: CI

on:
  push:
    branches: [ main ]
    # Only build on code-affecting changes; doc/site pushes skip CI.
    paths:
      - 'Source/**'
      - 'test/**'
      - 'libs/**'
      - 'CMakeLists.txt'
      - 'external/**'
      - '.github/workflows/ci.yml'
  pull_request:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.8
          path: JUCE

      - name: Configure (Windows)
        shell: pwsh
        run: |
          cmake -S . -B build-ci-win -G "Visual Studio 17 2022" -A x64 `
            -DJUCE_PATH="${{ github.workspace }}\JUCE" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 (Windows)
        shell: pwsh
        run: cmake --build build-ci-win --config Release --target OpenVoxTuner_VST3

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.8
          path: JUCE

      - name: Configure (macOS)
        run: |
          cmake -S . -B build-ci-mac -G Ninja \
            -DJUCE_PATH="${{ github.workspace }}/JUCE" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DOVT_ENABLE_AU=ON

      - name: Build VST3 + AU + Standalone (macOS)
        run: |
          cmake --build build-ci-mac --config Release --target OpenVoxTuner_VST3
          cmake --build build-ci-mac --config Release --target OpenVoxTuner_AU
          cmake --build build-ci-mac --config Release --target OpenVoxTuner_Standalone

  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.8
          path: JUCE

      - name: Configure (Windows)
        shell: pwsh
        run: |
          cmake -S . -B build-ci-test -G "Visual Studio 17 2022" -A x64 `
            -DJUCE_PATH="${{ github.workspace }}\JUCE" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        shell: pwsh
        run: cmake --build build-ci-test --config Release --target OpenVoxTunerTests

      - name: Run tests
        shell: pwsh
        run: ./build-ci-test/OpenVoxTunerTests_artefacts/Release/OpenVoxTunerTests.exe
