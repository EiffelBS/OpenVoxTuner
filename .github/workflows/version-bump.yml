name: Version Bump

on:
  push:
    branches: [ main ]
    # Only bump/release when the plugin code actually changes; doc/site pushes
    # must not create a tag nor dispatch the heavy release build.
    paths:
      - 'Source/**'
      - 'CMakeLists.txt'
      - 'external/**'
      - '.github/workflows/version-bump.yml'

permissions:
  contents: write
  # Needed to dispatch the Release workflow via `gh workflow run` (workflow_dispatch).
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    # Prevent an infinite loop: the Release workflow commits latest.json back to
    # main (as github-actions[bot]); that push must NOT trigger another bump.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-increment patch version
        id: version
        shell: bash
        run: |
          git fetch --tags origin 2>/dev/null || true

          # Find the latest tag matching v*.*.*
          LATEST_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            # No tag exists yet: start at v0.1.0
            NEW_TAG="v0.1.0"
          else
            # Strip the 'v' prefix and split by '.'
            VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "Latest tag: $LATEST_TAG"
          echo "New tag:    $NEW_TAG"

          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Update site version (consts.ts)
        # Keep the marketing site's displayed version in sync with the release so
        # nobody has to edit site/src/consts.ts by hand. Committed to main BEFORE
        # the tag is created so the tag (and the release built from it) carries it.
        # This push does NOT re-trigger this workflow: consts.ts is not in the
        # `paths` filter above, and the Release workflow commits latest.json back
        # to main as github-actions[bot] (also excluded via the job-level `if`).
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        shell: bash
        run: |
          VER="${NEW_TAG#v}"
          FILE="site/src/consts.ts"
          git checkout main
          sed -i.bak "s/export const VERSION = '.*';/export const VERSION = '$VER';/" "$FILE"
          rm -f "$FILE.bak"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if ! git diff --cached --quiet; then
            git commit -m "chore: update site version to $NEW_TAG"
            git push origin main
          else
            echo "consts.ts already at $VER — nothing to commit."
          fi

      - name: Create and push tag
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "chore: auto-bump version to $NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Trigger release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        shell: bash
        run: |
          # A GITHUB_TOKEN-driven tag push does not re-trigger the on-tag-push
          # Release workflow (GitHub limitation to avoid recursion). Dispatch it
          # explicitly with the new version so a release is created on push.
          gh workflow run release.yml --ref main -f version="$NEW_TAG"