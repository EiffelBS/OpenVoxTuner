name: Deploy MkDocs Documentation

# Builds the MkDocs site and deploys it to Cloudflare Pages (domain
# ovtdocs.eiffelbs.ovh). Cloudflare Pages is used instead of GitHub Pages so
# the docs can have its own custom domain (GitHub Pages only allows one
# custom domain per repo, already used by the Astro landing site).
#
# Required GitHub secret: CLOUDFLARE_API_TOKEN
#   Create an API token in Cloudflare (My Profile -> API Tokens -> Create
#   Token) with the "Cloudflare Pages:Edit" permission, scoped to your account
#   and the "openvoxtuner-docs" Pages project, then add it as a repo secret.
#
# The Cloudflare Pages project "openvoxtuner-docs" must exist (connected to
# this repo or created with `wrangler pages project create`). Its build config
# is defined in wrangler.toml and mirrored here.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'wrangler.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mkdocs-material mkdocs-git-revision-date-localized-plugin

      - name: Build documentation
        run: mkdocs build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site-docs --project-name=openvoxtuner-docs
