site_name: OpenVoxTuner Documentation
site_url: https://ovtdocs.eiffelbs.ovh/
site_description: Real-time pitch correction & harmony generation for vocals. VST3 / AU / Standalone — Open Source AGPLv3.
site_author: EiffelBS
copyright: © 2026 EiffelBS. Licensed under AGPLv3.

docs_dir: docs
site_dir: site-docs

theme:
  name: material
  language: en
  logo: assets/icon.svg
  favicon: assets/icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips

nav:
  - Home: index.md
  - Installation: installation.md
  - User Guide:
    - Quick Start: user-guide/quickstart.md
    - Correction Modes: user-guide/correction-modes.md
    - Curve Editor: user-guide/curve-editor.md
    - Harmony Generation: user-guide/harmony.md
    - Default Parameters: default-parameters.md
  - Architecture:
    - Overview: architecture.md
    - DSP Pipeline: architecture/dsp-pipeline.md
    - User Interface: architecture/ui.md
  - Development:
    - Build Guide: build-guide.md
    - Tests: testing.md
    - Contributing: contributing.md
  - Reference:
    - DSP API: reference/dsp-api.md
    - ARA2: reference/ara2.md
    - Presets: reference/presets.md
  - License: license.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      type: date
      timezone: Europe/Paris

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/EiffelBS/OpenVoxTuner
    - icon: fontawesome/brands/discord
      link: https://discord.gg/openvoxtuner
  generator: false
  version:
    provider: mike
